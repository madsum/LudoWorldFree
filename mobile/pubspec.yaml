name: mobile
description: "Ludo World Free by iProSoft - Commercial Mobile Ludo Game"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking & Utilities
  dio: ^5.5.0+1
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.1.0
  google_mobile_ads: ^9.1.0

  # Real OAuth Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  flutter_web_auth_2: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ludo-loog.jpeg"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/
    - assets/images/
