#version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: ludo_db
    restart: always
    environment:
      POSTGRES_DB: ludoworldfreedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ludoworldfreedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ludo_network

  # 2. Spring Boot Java Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ludo_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ludoworldfreedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ludo_network

  # 3. Flutter Web Client Service (Nginx)
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: ludo_mobile_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ludo_network

networks:
  ludo_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
