# Spring Boot Server Configuration for Google Cloud Run
server.port=${PORT:8080}
spring.application.name=ludo-world-free-backend

# Active Profile (default: dev for local testing, overridden by SPRING_PROFILES_ACTIVE=prod on Cloud Run)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL Database Configuration (Production / Cloud SQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ludoworldfree}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Realtime events and online leases share PostgreSQL, allowing Cloud Run instances
# to coordinate without a separately provisioned cache or broker.

# HS256 is for local development. Production must provide a private secret via
# Secret Manager or switch CHAT_JWT_ALGORITHM/issuer configuration to its IdP.
chat.jwt.secret=${CHAT_JWT_SECRET:local-chat-development-key-change-me-32}
chat.jwt.issuer=${CHAT_JWT_ISSUER:}
chat.jwt.audience=${CHAT_JWT_AUDIENCE:}
chat.presence.heartbeat-seconds=${CHAT_PRESENCE_HEARTBEAT_SECONDS:25}
chat.presence.ttl-seconds=${CHAT_PRESENCE_TTL_SECONDS:65}
chat.media.bucket=${CHAT_MEDIA_BUCKET:}
chat.media.region=${CHAT_MEDIA_REGION:eu-west-1}
chat.media.endpoint=${CHAT_MEDIA_ENDPOINT:}
chat.media.upload-url-minutes=${CHAT_MEDIA_UPLOAD_URL_MINUTES:10}
chat.media.download-url-minutes=${CHAT_MEDIA_DOWNLOAD_URL_MINUTES:5}
chat.outbox.poll-millis=${CHAT_OUTBOX_POLL_MILLIS:500}

# Optional TURN relay configuration. Credentials are generated per signaling session.
voice.turn.urls=${VOICE_TURN_URLS:}
voice.turn.shared-secret=${VOICE_TURN_SHARED_SECRET:}
voice.turn.credential-ttl-seconds=${VOICE_TURN_CREDENTIAL_TTL_SECONDS:3600}

# Avatar uploads are size-limited again in PlayerProfileController after parsing.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# Existing installations baseline at V1; fresh databases run V1__baseline_schema.sql.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
