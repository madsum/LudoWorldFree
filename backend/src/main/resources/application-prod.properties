# Production Profile: Google Cloud Run + PostgreSQL / Cloud SQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql:///ludoworldfreedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Connection Pool Tuning for Serverless Cloud Run
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# Cloud Run sets PORT; the default application.properties value handles it.
server.port=${PORT:8080}

# Comma-separated browser origins allowed to call the API ("*" is the default).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
# Chat is unavailable until a strong secret is supplied. Other backend APIs can still start.
chat.jwt.secret=${CHAT_JWT_SECRET:}
